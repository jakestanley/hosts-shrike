# Syntax-checks every playbook. All the logic is in hosts-core's CI image
# (see hosts-core README "CI deployments").
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

# Pin to the Docker-backed agent - an unlabeled workflow can match the
# native host-apply agent, which can't run image: steps.
labels:
  backend: docker

steps:
  - name: validate
    image: hosts-core-ci:v2.4.0
    commands:
      - cd ansible && hosts-ci validate
