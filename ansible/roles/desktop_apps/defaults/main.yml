---
# Canonical desktop app list for shrike. Installed via winget over the
# SSH-as-mail transport (see docs/unattended.md "SSH transport for
# desktop apps"). To add or remove an entry, see AGENTS.md
# "Adding a new desktop app".
#
# Keep alphabetised within each source group for diff-friendliness.
# Add a trailing `# Display name` comment when the id is opaque
# (msstore entries always need one — they use numeric ids).
desktop_packages:
  # winget source
  - { id: 'AgileBits.1Password',                  source: 'winget' }
  - { id: 'Discord.Discord',                      source: 'winget' }
  - { id: 'Dropbox.Dropbox',                      source: 'winget' }
  - { id: 'Hawaii_Beach.TinyNvidiaUpdateChecker', source: 'winget' }
  - { id: 'ImageMagick.Q16',                      source: 'winget' }
  - { id: 'Meta.Oculus',                          source: 'winget' }  # Meta Horizon Link (Quest PC VR runtime)
  - { id: 'Microsoft.Git',                        source: 'winget' }
  - { id: 'Mozilla.Firefox',                      source: 'winget' }
  - { id: 'Obsidian.Obsidian',                    source: 'winget' }
  - { id: 'thebookisclosed.Vive',                 source: 'winget' }  # ViveTool — Windows feature flag toggler
  - { id: 'Valve.Steam',                          source: 'winget' }
  - { id: 'VideoLAN.VLC',                         source: 'winget' }
  - { id: 'vim.vim',                              source: 'winget' }
  - { id: 'Zagrios.BSManager',                    source: 'winget' }  # Beat Saber mod / version manager
  # Spotify.Spotify is deliberately excluded: its installer rejects any
  # elevated session context, and SSH-as-mail always carries an admin
  # token (mail is in Administrators + we use administrators_authorized_keys).
  # Both --scope user and the msstore variant (9NCBCSZSJRSB) fail to help
  # — the former is still admin-rejected, the latter installs a parallel
  # UWP copy. Install once manually from a non-elevated interactive shell.

  # Microsoft Store (msstore source uses opaque ProductIds)
  - { id: '9MV0B5HZVK9Z',                         source: 'msstore' }   # Xbox app
  - { id: '9NKSQGP7F2NH',                         source: 'msstore' }   # WhatsApp

# Apps not on winget, installed from a pinned GitHub release zip into
# mail's %LOCALAPPDATA%\Programs\<name>. Files are overwritten in place
# on upgrade, so anything the app writes next to its exe (config,
# saves) survives a version bump. To upgrade, bump version, asset,
# sha256 (and archive_root if versioned) together; the sha256 is the
# digest GitHub publishes for the release asset.
#
# Entry shape:
#   - name: 'dsda-doom'                  # install dir name
#     repo: 'dsda-org/dsda-doom'
#     version: 'v0.30.1'                 # release tag
#     asset: 'dsda-doom-0.30.1-win-x64.zip'
#     sha256: '<64 hex>'
#     archive_root: 'dsda-doom-0.30.1-win-x64'
#
# archive_root: the single top-level folder inside the zip, if any;
# its contents are what get installed. Empty when files sit at the
# zip root.
github_release_packages:
  # Unmaintained since 2.14.3 (Dec 2024) and reported broken on some
  # Windows 11 25H2 setups, but confirmed working on shrike. GitHub
  # publishes no digest for this release, so the sha256 was computed
  # from the downloaded asset.
  - name: 'UWPHook'                            # adds Xbox / Game Pass games to Steam
    repo: 'BrianLima/UWPHook'
    version: '2.14.3'
    asset: 'UWPHook.zip'
    sha256: '0c542cf2b2753b618b96d4050c08db83317826993744678f36a50745b847b1fb'
    archive_root: ''

# Per-user Start menu shortcuts in mail's profile, for apps whose
# install doesn't create one (winget portable zips, GitHub release
# zips). `paths` are candidate exe locations, environment variables
# expanded and wildcards allowed; the first match wins. No match means
# the app isn't installed and the shortcut is skipped.
#
# Entry shape:
#   - name: 'dsda-doom'                  # shortcut name
#     paths:
#       - '%LOCALAPPDATA%\Programs\dsda-doom\dsda-doom.exe'
start_menu_shortcuts:
  - name: 'UWPHook'
    paths:
      - '%LOCALAPPDATA%\Programs\UWPHook\UWPHook.exe'
