# Deploys shrike's config. shrike is a desktop that's often in use: a push
# only dry-runs (and skips, green, if shrike is off); applying is a manual
# run, with the variable DEPLOY_PLAYBOOK choosing the playbook (default
# playbooks/shrike-bootstrap.yml; e.g. playbooks/shrike-telegraf.yml).
# shrike-desktop-apps.yml runs as `mail`, not the CI user - not for CI.
# All the logic is in hosts-core's CI image (see hosts-core README
# "CI deployments").
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

depends_on:
  - validate

labels:
  backend: docker

steps:
  - name: deploy
    image: hosts-core-ci:v2.4.0
    environment:
      ANSIBLE_DEPLOY_KEY:
        from_secret: ansible_deploy_key
      TELEGRAF_TOKEN:
        from_secret: telegraf_token
      DEPLOY_HOST: shrike
      DEPLOY_ON_PUSH: check
      DEPLOY_ADDRESS: shrike.stanley.arpa
      DEPLOY_SKIP_IF_OFFLINE: "true"
      DEPLOY_DEFAULT_PLAYBOOK: playbooks/shrike-bootstrap.yml
    commands:
      - cd ansible && hosts-ci deploy
