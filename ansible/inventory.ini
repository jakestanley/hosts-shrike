[windows]
shrike ansible_host=shrike.stanley.arpa

# Standard machine config: SSH key auth as the `ansible` local admin.
# sshd reads one administrators_authorized_keys file for every admin,
# so the key shrike-ssh-bootstrap.yml publishes covers `ansible` as
# well as `mail`. No password prompt. See docs/unattended.md.
[windows:vars]
ansible_connection=ssh
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
ansible_shell_type=powershell

# WinRM as `ansible`, password via --ask-pass. Only used by
# shrike-ssh-bootstrap.yml, which has to run before SSH exists on a
# fresh rebuild.
[windows_winrm]
shrike-winrm ansible_host=shrike.stanley.arpa

[windows_winrm:vars]
ansible_connection=winrm
ansible_user=ansible
ansible_port=5985
ansible_winrm_scheme=http
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
# Bumped for long-running tasks (Chocolatey installing big apps, robocopy, etc.).
# Defaults (30s/20s) timed out during Steam install.
ansible_winrm_read_timeout_sec=1800
ansible_winrm_operation_timeout_sec=1500

# SSH-as-mail for desktop app management via winget. winget/AppX need
# the MSA user's interactive-equivalent session, so this stays separate
# from `windows`. Do not use it for the standard config playbooks.
[shrike_ssh]
shrike-ssh ansible_host=shrike.stanley.arpa

[shrike_ssh:vars]
ansible_connection=ssh
ansible_user=mail
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
ansible_shell_type=powershell
