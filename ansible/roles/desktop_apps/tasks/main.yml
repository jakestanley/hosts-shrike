---
# Each step is also reusable from other roles via include_role
# tasks_from, passing its list variable (the doom role does this).
- name: Install winget packages
  ansible.builtin.import_tasks: winget.yml

- name: Install GitHub release packages
  ansible.builtin.import_tasks: github_release.yml

- name: Create Start menu shortcuts
  ansible.builtin.import_tasks: shortcuts.yml
